  pulse_fwhm_420: {value: 0.5, unit: ns, tag: "[C]", tbd: true, note: "Final pulse duration at 420 nm open (CONTEXT.md 7). Sub-ns placeholder."}

# ---------------------------------------------------------------------------------------------
# M1 test spheres and cell properties
cell:
  test_diameters: {value: [7, 12], unit: µm, tag: "[S]", note: "M1 prompt test cases. Not measured cell sizes."}
  sound_speed: {value: 1550, unit: m/s, tag: "[C]", tbd: true, note: "Placeholder per M1 prompt. Literature for cells 1560 to 1575 m/s [L, P2]."}
  sound_speed_literature: {value: [1560, 1575], unit: m/s, tag: "[L, P2]"}
  density: {value: 1000, unit: kg/m³, tag: "[C]", tbd: true, note: "Placeholder, set near water so the M1 sphere is close to acoustically matched."}
  gruneisen: {value: 0.12, unit: "1", tag: "[L, water near 22 °C]", tbd: true, note: "Cell Grüneisen parameter unknown; water value used."}
  heat_capacity: {value: 4000, unit: J/(kg K), tag: "[L, water-like]", tbd: true}
  mua_532: {value: 0.2, unit: 1/cm, tag: "[C]", tbd: true, note: "Unstained cell at 532 nm. Estimate: ~10 µM haem proteins (cytochromes) at ~10 /mM/cm gives 2.303 x 10 x 0.01 = 0.23 /cm. Very uncertain; page 12 sweeps 0.01 to 10 /cm."}
  jurkat_diameter: {value: [11, 12], unit: µm, tag: "[L]", tbd: true, note: "CONTEXT.md 7: literature suggests about 11 to 12 µm; verify."}
  tcell_diameter: {value: 7, unit: µm, tag: "[L]", tbd: true, note: "CONTEXT.md 7: about 7 µm; verify."}
  nucleus_ratio: {value: null, unit: "1", tag: "[L]", tbd: true, note: "Nucleus-to-cell ratio, both types. Not used in M1."}
  mito_load: {value: null, unit: "1", tag: "[L]", tbd: true, note: "Mitochondrial load, both types. Not used in M1."}
  compartment_sound_speed: {value: null, unit: m/s, tag: "[L]", tbd: true, note: "Nucleus, cytoplasm, medium. Not used in M1."}
  compartment_absorption: {value: null, unit: 1/cm, tag: "[L]", tbd: true, note: "Per compartment at 266, 420, 532 nm. Not used in M1."}

# ---------------------------------------------------------------------------------------------
# Water (medium) and PMMA
water:
  density: {value: 998, unit: kg/m³, tag: "[L, water at 20 °C]"}
  sound_speed_coeffs: {value: [1402.385, 5.038813, -5.799136e-2, 3.287156e-4, -1.398845e-6, 2.787860e-9], unit: "m/s per °C^k", tag: "[L, Marczak 1997]", note: "c(T) = sum a_k T^k, T in °C, 0 to 95 °C."}
  atten_coeffs_low: {value: [4.937e-4, -2.59e-5, 9.11e-7, -1.50e-8], unit: "dB/(km kHz²) per °C^k", tag: "[L, Francois and Garrison 1982]", note: "Pure-water f² term, T <= 20 °C."}
  atten_coeffs_high: {value: [3.964e-4, -1.146e-5, 1.45e-7, -6.5e-10], unit: "dB/(km kHz²) per °C^k", tag: "[L, Francois and Garrison 1982]", note: "Pure-water f² term, T > 20 °C."}
  atten_20C_reference: {value: 0.00217, unit: dB/(cm MHz²), tag: "[L, Pinkerton 1949]", note: "alpha/f² = 25.0e-17 s²/cm (Np) at 20 °C, independent cross-check of the formula."}
pmma:
  sound_speed: {value: 2750, unit: m/s, tag: "[L, typical acrylic]", tbd: true}
  density: {value: 1190, unit: kg/m³, tag: "[L, typical acrylic]"}
  atten_coeff: {value: 0.5, unit: dB/(cm MHz^n), tag: "[L, typical acrylic]", tbd: true, note: "Power law alpha = a0 f^n. Placeholder."}
  atten_exponent: {value: 1.0, unit: "1", tag: "[L, typical acrylic]", tbd: true}

