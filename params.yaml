  pulse_length_12um_1550: {value: 7.7, unit: ns, tag: "[C]", note: "CONTEXT.md 5: 12 µm at 1550 m/s gives 7.7 ns."}
  laser_cutoff_factor: {value: 0.44, unit: "1", tag: "[C]", note: "Cut-off ~ 0.44 / pulse FWHM (half-amplitude point of a Gaussian)."}
  laser_cutoff_1p3ns: {value: 340, unit: MHz, tag: "[C]", note: "CONTEXT.md 5."}
  p1_water_loss: {value: 20, unit: dB, tag: "[L, P1]", note: "As quoted in CONTEXT.md 5: about 20 dB over 50 µm of water at 1 GHz and 37 °C."}
  p1_water_loss_path: {value: 50, unit: µm, tag: "[L, P1]"}
  p1_water_loss_freq: {value: 1000, unit: MHz, tag: "[L, P1]"}
  p1_water_loss_temp: {value: 37, unit: °C, tag: "[L, P1]"}
  p2_mcf7_diameter: {value: 17.5, unit: µm, tag: "[L, P2]"}
  p2_mcf7_sound_speed: {value: 1573, unit: m/s, tag: "[L, P2]"}
  p2_mcf7_optical_diameter: {value: 16, unit: µm, tag: "[L, P2]"}
  gold_film_thickness: {value: 200, unit: nm, tag: "[L, P1]"}

