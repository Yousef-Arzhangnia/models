[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "u4"
version = "0.1.0"
description = "OR-PAM Upgrade 4 models: forward chain, tracker and board"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy==2.1.3",
    "scipy==1.14.1",
    "matplotlib==3.9.2",
    "pandas==2.2.3",
    "pyyaml==6.0.2",
    "streamlit==1.41.1",
    "plotly==5.24.1",
    "pillow==11.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
